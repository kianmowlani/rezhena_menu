    /*

    APPLICATION STATE
    ============================================================

    تمام وضعیت UI در یک Object نگهداری می‌شود.
    این کار توسعه نسخه‌های بعدی را بسیار ساده‌تر می‌کند.
    */

    const state = {

        activeCategory: 'all',

        search: '',

        isExpanded: false,

        selectedSizes: new Map()

    };


    /*
    ============================================================
    DOM REFERENCES
    ============================================================
    */

    const DOM = {

        products:
            document.getElementById('products'),

        search:
            document.getElementById('menuSearch'),

        categories:
            document.getElementById('categoryFilters'),

        noResults:
            document.getElementById('noResults'),

        toggleButton:
            document.getElementById('toggleMenuButton'),

        toggleText:
            document.getElementById('toggleMenuText'),

        toggleIcon:
            document.getElementById('toggleMenuIcon'),

        controls:
            document.getElementById('menuControls'),

        welcomeModal:
            document.getElementById('welcomeModal'),

        welcomeButton:
            document.getElementById('welcomeButton')

    };


    /*
    ============================================================
    HELPERS
    ============================================================
    */

    function formatPrice(price) {

        return Number(price)
            .toLocaleString('fa-IR');

    }


    function normalizeText(value) {

        return String(value || '')
            .trim()
            .toLowerCase()
            .replace(/ي/g, 'ی')
            .replace(/ك/g, 'ک');

    }


    /*
    ============================================================
    FILTER ENGINE
    ============================================================
    */

    function getFilteredProducts() {

        const searchTerm =
            normalizeText(state.search);

        return MENU_ITEMS.filter(item => {

            const categoryMatch =
                state.activeCategory === 'all' ||
                item.category === state.activeCategory;

            const nameMatch =
                !searchTerm ||
                normalizeText(item.name)
                    .includes(searchTerm) ||
                normalizeText(item.category)
                    .includes(searchTerm);

            return categoryMatch && nameMatch;

        });

    }


    /*
    ============================================================
    PRODUCT CARD CREATOR
    ============================================================

    نکته امنیتی مهم:

    برای اطلاعات متغیر محصول از innerHTML استفاده نمی‌کنیم.
    بنابراین اگر بعدها داده‌ها از API بیایند، سطح ریسک XSS کمتر می‌شود.
    */

    function createProductCard(item, index) {

        const card =
            document.createElement('article');

        card.dataset.productIndex = index;

        card.className = `
            group
            relative
            isolate
            overflow-hidden
            rounded-[28px]
            border
            border-white/75
            bg-gradient-to-br
            from-white/80
            to-white/45
            p-3
            shadow-[0_18px_50px_rgba(89,56,105,.10)]
            backdrop-blur-[22px]
            transition
            duration-500
            hover:-translate-y-2
            hover:border-white
            hover:shadow-[0_28px_70px_rgba(89,56,105,.17)]
            animate-cardReveal
        `;


        /*
        --------------------------------------------------------
        Image wrapper
        --------------------------------------------------------
        */

        const imageWrapper =
            document.createElement('div');

        imageWrapper.className = `
            relative
            overflow-hidden
            rounded-[24px]
            bg-gradient-to-br
            from-white
            to-[#eefafa]/70
        `;


        /*
        Image
        */

        const image =
            document.createElement('img');

        image.className = `
            h-[230px]
            w-full
            object-cover
            transition
            duration-700
            ease-out
            group-hover:scale-[1.07]
        `;

        image.src = item.image;

        image.alt = item.name;

        image.loading =
            index < 6
                ? 'eager'
                : 'lazy';

        image.decoding = 'async';


        /*
        Image error fallback
        */

        image.addEventListener(
            'error',
            () => {

                if (
                    image.src !==
                    APP_CONFIG.FALLBACK_IMAGE
                ) {

                    image.src =
                        APP_CONFIG.FALLBACK_IMAGE;
                }

            },
            {
                once: true
            }
        );


        /*
        --------------------------------------------------------
        Category glass badge
        --------------------------------------------------------
        */

        const badge =
            document.createElement('div');

        badge.className = `
            absolute
            right-3
            top-3
            rounded-full
            border
            border-white/50
            bg-white/25
            px-3
            py-1.5
            text-[11px]
            font-bold
            text-white
            shadow-lg
            backdrop-blur-xl
        `;

        badge.textContent =
            item.category;


        /*
        --------------------------------------------------------
        Image shine
        --------------------------------------------------------
        */

        const shine =
            document.createElement('div');

        shine.className = `
            pointer-events-none
            absolute
            inset-0
            -translate-x-[120%]
            bg-gradient-to-r
            from-transparent
            via-white/40
            to-transparent
            transition-transform
            duration-700
            group-hover:translate-x-[120%]
        `;


        /*
        --------------------------------------------------------
        Content
        --------------------------------------------------------
        */

        const content =
            document.createElement('div');

        content.className =
            'px-2 pb-2 pt-5';


        /*
        Header
        */

        const header =
            document.createElement('div');

        header.className = `
            flex
            items-center
            justify-between
            gap-3
        `;


        /*
        Product name
        */

        const title =
            document.createElement('h2');

        title.className = `
            text-lg
            font-extrabold
            text-[#582f57]
        `;

        title.textContent =
            item.name;


        /*
        Price wrapper
        */

        const priceWrapper =
            document.createElement('div');

        priceWrapper.className = `
            whitespace-nowrap
            text-left
        `;


        const price =
            document.createElement('span');

        price.dataset.priceDisplay =
            '';

        price.className = `
            text-xl
            font-black
            text-[#e2558c]
        `;


        const prices =
            PRODUCT_PRICES[item.name] ||
            [100, 130, 160];


        const savedSize =
            state.selectedSizes.get(item.name) ??
            0;


        price.textContent =
            formatPrice(
                prices[savedSize]
            );


        const priceUnit =
            document.createElement('span');

        priceUnit.className = `
            text-xs
            text-[#9a718f]
        `;

        priceUnit.textContent =
            ' هزار';


        /*
        --------------------------------------------------------
        Size buttons
        --------------------------------------------------------
        */

        const sizeWrapper =
            document.createElement('div');

        sizeWrapper.className =
            'mt-5 flex gap-2';


        const sizeNames = [
            'کوچک',
            'متوسط',
            'بزرگ'
        ];


        sizeNames.forEach(
            (sizeName, sizeIndex) => {

                const button =
                    document.createElement('button');

                button.type =
                    'button';

                button.dataset.sizeIndex =
                    sizeIndex;

                button.dataset.productName =
                    item.name;

                button.setAttribute(
                    'aria-label',
                    `${sizeName} ${item.name}`
                );

                button.setAttribute(
                    'aria-pressed',
                    savedSize === sizeIndex
                        ? 'true'
                        : 'false'
                );

                button.className = `
                    size-button
                    flex-1
                    rounded-xl
                    py-2.5
                    text-xs
                    font-bold
                    transition
                    duration-250
                    active:scale-95
                `;


                if (
                    savedSize === sizeIndex
                ) {

                    button.classList.add(
                        'bg-gradient-to-br',
                        'from-[#e85b91]',
                        'to-[#9b72c8]',
                        'text-white',
                        'shadow-[0_8px_22px_rgba(232,91,145,.25)]'
                    );

                } else {

                    button.classList.add(
                        'bg-white/60',
                        'text-[#7b5678]',
                        'hover:-translate-y-0.5',
                        'hover:bg-[#e85b91]/10',
                        'hover:text-[#a64276]'
                    );

                }


                button.textContent =
                    sizeName;


                sizeWrapper.appendChild(
                    button
                );

            }
        );


        /*
        --------------------------------------------------------
        Assemble card
        --------------------------------------------------------
        */

        imageWrapper.appendChild(image);

        imageWrapper.appendChild(badge);

        imageWrapper.appendChild(shine);


        priceWrapper.appendChild(price);

        priceWrapper.appendChild(priceUnit);


        header.appendChild(title);

        header.appendChild(priceWrapper);


        content.appendChild(header);

        content.appendChild(sizeWrapper);


        card.appendChild(imageWrapper);

        card.appendChild(content);


        return card;

    }


    /*
    ============================================================

    function renderCategories() {

        const categories = [

        categories.forEach(

                button.dataset.category =
                    category;

                button.setAttribute(
                    'aria-pressed',
                    'false'
                );

                button.className = `
                    category-btn
                    shrink-0
                    rounded-full
                    border
                    border-white/80
                    bg-white/60
                    px-5
                    py-2.5
                    text-xs
                    font-bold
                    text-[#795675]
                    backdrop-blur-xl
                    transition
                    duration-300
                    hover:-translate-y-0.5
                    hover:bg-white/85
                    active:scale-95
                `;

                button.textContent =
                    category;


                DOM.categories.appendChild(
                    button
                );

            }
        );

    }


    /*
    ============================================================
    UPDATE CATEGORY UI
    ============================================================
    */

    function updateCategoryUI() {

        DOM.categories
            .querySelectorAll('.category-btn')
            .forEach(button => {

                const active =
                    button.dataset.category ===
                    state.activeCategory;


                button.setAttribute(
                    'aria-pressed',
                    active
                        ? 'true'
                        : 'false'
                );


                button.classList.toggle(
                    'bg-gradient-to-br',
                    active
                );

                button.classList.toggle(
                    'from-[#e85b91]',
                    active
                );

                button.classList.toggle(
                    'to-[#9b72c8]',
                    active
                );

                button.classList.toggle(
                    'text-white',
                    active
                );

                button.classList.toggle(
                    'text-[#795675]',
                    !active
                );

                button.classList.toggle(
                    'shadow-[0_8px_22px_rgba(232,91,145,.22)]',
                    active
                );

            });

    }


    /*
    ============================================================
    RENDER PRODUCTS
    ============================================================
    */

    function renderProducts() {

        const products =
            getFilteredProducts();


        /*
        اگر جستجو یا فیلتر فعال باشد،
        تعداد محصولات قابل نمایش بر اساس نتیجه است.
        */

        const visibleProducts =
            state.isExpanded
                ? products
                : products.slice(
                    0,
                    APP_CONFIG.INITIAL_VISIBLE_PRODUCTS
                );


        DOM.products.replaceChildren();


        visibleProducts.forEach(
            (item, index) => {

                DOM.products.appendChild(
                    createProductCard(
                        item,
                        index
                    )
                );

            }
        );


        /*
        --------------------------------------------------------
        No Result
        --------------------------------------------------------
        */

        const hasResults =
            products.length > 0;


        DOM.noResults.classList.toggle(
            'hidden',
            hasResults
        );


        /*
        --------------------------------------------------------
        Toggle button visibility
        --------------------------------------------------------

        اگر نتیجه کمتر از 15 باشد،
        دکمه اصلاً نمایش داده نمی‌شود.
        */

        const canExpand =
            products.length >
            APP_CONFIG.INITIAL_VISIBLE_PRODUCTS;


        DOM.controls.classList.toggle(
            'hidden',
            !canExpand
        );


        updateToggleButton();

    }


    /*
    ============================================================
    TOGGLE BUTTON UI
    ============================================================
    */

    function updateToggleButton() {

        if (state.isExpanded) {

            DOM.toggleText.textContent =
                'نمایش کمتر';


            DOM.toggleIcon.style.transform =
                'rotate(180deg)';

        } else {

            DOM.toggleText.textContent =
                'نمایش کل منو';


            DOM.toggleIcon.style.transform =
                'rotate(0deg)';

        }

    }


    /*
    ============================================================
    SEARCH
    ============================================================
    */

    DOM.search.addEventListener(
        'input',
        event => {

            state.search =
                event.target.value;

            /*
            هنگام جستجو، حالت Expand حفظ می‌شود.
            */

            renderProducts();

        }
    );


    /*
    ============================================================
    CATEGORY FILTER
    ============================================================
    */

    DOM.categories.addEventListener(
        'click',
        event => {

            const button =
                event.target.closest(
                    '.category-btn'
                );


            if (!button) {
                return;
            }


            state.activeCategory =
                button.dataset.category;


            /*
            با تغییر دسته‌بندی از ابتدا 15 محصول
            نمایش داده می‌شود.
            */

            state.isExpanded =
                false;


            updateCategoryUI();

            renderProducts();

        }
    );


    /*
    ============================================================
    SIZE SELECTOR
    ============================================================
    */

    DOM.products.addEventListener(
        'click',
        event => {

            const button =
                event.target.closest(
                    '[data-size-index]'
                );


            if (!button) {
                return;
            }


            const card =
                button.closest(
                    '[data-product-index]'
                );


            if (!card) {
                return;
            }


            const productName =
                button.dataset.productName;


            const sizeIndex =
                Number(
                    button.dataset.sizeIndex
                );


            const prices =
                PRODUCT_PRICES[
                    productName
                ] || [100, 130, 160];


            /*
            State را به‌روزرسانی می‌کنیم.
            */

            state.selectedSizes.set(
                productName,
                sizeIndex
            );


            /*
            Price
            */

            const priceElement =
                card.querySelector(
                    '[data-price-display]'
                );


            if (priceElement) {

                priceElement.classList.remove(
                    'animate-priceChange'
                );


                /*
                Force reflow
                */

                void priceElement.offsetWidth;


                priceElement.textContent =
                    formatPrice(
                        prices[sizeIndex]
                    );


                priceElement.classList.add(
                    'animate-priceChange'
                );

            }


            /*
            Button states
            */

            card.querySelectorAll(
                '[data-size-index]'
            ).forEach(
                sizeButton => {

                    const active =
                        Number(
                            sizeButton.dataset.sizeIndex
                        ) === sizeIndex;


                    sizeButton.setAttribute(
                        'aria-pressed',
                        active
                            ? 'true'
                            : 'false'
                    );


                    sizeButton.classList.toggle(
                        'bg-gradient-to-br',
                        active
                    );

                    sizeButton.classList.toggle(
                        'from-[#e85b91]',
                        active
                    );

                    sizeButton.classList.toggle(
                        'to-[#9b72c8]',
                        active
                    );

                    sizeButton.classList.toggle(
                        'text-white',
                        active
                    );

                    sizeButton.classList.toggle(
                        'shadow-[0_8px_22px_rgba(232,91,145,.25)]',
                        active
                    );

                    sizeButton.classList.toggle(
                        'bg-white/60',
                        !active
                    );

                    sizeButton.classList.toggle(
                        'text-[#7b5678]',
                        !active
                    );

                }
            );

        }
    );


    /*
    ============================================================
    SHOW MORE / SHOW LESS
    ============================================================
    */

    DOM.toggleButton.addEventListener(
        'click',
        () => {

            /*
            قبل از تغییر DOM موقعیت دقیق کاربر را نگه می‌داریم.
            */

            const previousScrollY =
                window.scrollY;


            if (!state.isExpanded) {

                /*
                ------------------------------------------------
                EXPAND
                ------------------------------------------------
                */

                state.isExpanded =
                    true;


                renderProducts();


                /*
                ابتدا Scroll را دقیقاً به محل قبلی برمی‌گردانیم.
                بنابراین هنگام Render هیچ Jump ناخواسته‌ای رخ نمی‌دهد.
                */

                window.scrollTo({
                    top: previousScrollY,
                    behavior: 'instant'
                });


                /*
                سپس بعد از Render کامل،
                به پایین لیست حرکت می‌کنیم.
                */

                requestAnimationFrame(
                    () => {

                        setTimeout(
                            () => {

                                DOM.products
                                    .lastElementChild
                                    ?.scrollIntoView({
                                        behavior:
                                            APP_CONFIG.SCROLL_BEHAVIOR,
                                        block:
                                            'end'
                                    });

                            },
                            APP_CONFIG.EXPAND_SCROLL_DELAY
                        );

                    }
                );

            } else {

                /*
                ------------------------------------------------
                COLLAPSE
                ------------------------------------------------
                */

                state.isExpanded =
                    false;


                renderProducts();


                /*
                هنگام کم کردن لیست نیز Scroll
                ناگهان به ابتدای صفحه نمی‌رود.
                */

                window.scrollTo({
                    top: previousScrollY,
                    behavior: 'instant'
                });


                /*
                کنترل منو دوباره قابل مشاهده باشد.
                */

                setTimeout(
                    () => {

                        DOM.controls.scrollIntoView({
                            behavior:
                                APP_CONFIG.SCROLL_BEHAVIOR,
                            block: 'center'
                        });

                    },
                    50
                );

            }

        }
    );


    /*
    ============================================================
    WELCOME MODAL
    ============================================================

    نکته:
    هیچ sessionStorage استفاده نشده است.

    بنابراین:
    هر بار صفحه Refresh شود،
    Modal دوباره نمایش داده می‌شود.

    همچنین:
    - کلیک بیرون Modal آن را نمی‌بندد.
    - Escape آن را نمی‌بندد.
    - فقط دکمه می‌تواند Modal را ببندد.
    */

    function closeWelcomeModal() {

        DOM.welcomeModal.classList.add(
            'hidden'
        );

        document.body.classList.remove(
            'overflow-hidden'
        );

    }


    DOM.welcomeButton.addEventListener(
        'click',
        closeWelcomeModal
    );


    /*
    Modal در هر Load نمایش داده می‌شود.
    */

    function initializeWelcomeModal() {

        DOM.welcomeModal.classList.remove(
            'hidden'
        );

        document.body.classList.add(
            'overflow-hidden'
        );

    }


    /*
    ============================================================
    INITIALIZE
    ============================================================
    */

    function initializeApp() {

        /*
        دسته‌بندی‌ها
        */

        renderCategories();


        /*
        محصولات
        */

        renderProducts();


        /*
        دسته‌بندی فعال
        */

        updateCategoryUI();


        /*
        Welcome
        */

        initializeWelcomeModal();

    }


    /*
    DOM آماده است چون Script انتهای Body قرار دارد.
    */

    initializeApp();

</script>


<!-- =========================================================
     IMPORTANT:
     برای اینکه Modal فقط با دکمه بسته شود،
     هیچ Event برای backdrop یا Escape تعریف نشده است.
========================================================== -->


</body>
